<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendo Practice App</title>
  <!-- Loads Tailwind CSS directly in the browser -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="transition-colors duration-300 min-h-screen bg-slate-50" id="app-body">
  <header class="flex flex-wrap justify-between items-center p-4 bg-white shadow">
    <div class="flex gap-4">
      <button id="tab-keiko" class="tab-btn px-4 py-2 font-bold text-red-600 border-b-2 border-red-600">Keiko</button>
      <button id="tab-tournament" class="tab-btn px-4 py-2 font-bold text-gray-500">Tournament</button>
      <button id="tab-scoreboard" class="tab-btn px-4 py-2 font-bold text-gray-500">Scoreboard</button>
    </div>
    <div class="flex items-center gap-2 mt-2 sm:mt-0">
      <label class="text-sm font-semibold text-gray-600">BG Color</label>
      <input type="color" id="bg-color" value="#f8fafc" class="cursor-pointer">
    </div>
  </header>
  
  <main id="app-content" class="p-4"></main>
  
  <!-- Loads your modular JavaScript -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
