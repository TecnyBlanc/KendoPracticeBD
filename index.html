<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendo Practice App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="app-body" class="min-h-screen transition-colors duration-300 font-sans" style="background-color: #f8fafc;">
  
  <!-- Global Navigation & Settings from your React Code -->
  <nav class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <h1 class="text-xl font-bold text-gray-900 tracking-tight flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-600 inline-block"></span>
          Kendo<span class="font-light">App</span>
        </h1>
        
        <div class="flex space-x-1 bg-gray-100 p-1 rounded-lg">
          <button id="tab-keiko" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition bg-white shadow-sm text-gray-900">Keiko Practice</button>
          <button id="tab-tournament" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition text-gray-500 hover:text-gray-700">Tournament</button>
          <button id="tab-scoreboard" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition text-gray-500 hover:text-gray-700">Scoreboard</button>
        </div>
      </div>

      <!-- Global Background Color Picker -->
      <div class="flex items-center gap-3">
        <i data-lucide="settings" class="w-4 h-4 text-gray-400"></i>
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Bg Color</span>
        <input type="color" id="bg-color" value="#f8fafc" class="w-6 h-6 p-0 border-0 rounded cursor-pointer" />
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main id="app-content" class="max-w-6xl mx-auto px-4 py-10"></main>

  <!-- Load Vanilla Scripts -->
  <script src="./js/app.js"></script>
  <script src="./js/keiko.js"></script>
  <script src="./js/tournament.js"></script>
  <script src="./js/scoreboard.js"></script>
  
  <script>
    // Initialize the app after scripts are loaded
    switchTab('keiko');
  </script>
</body>
</html>
